name: Optimization checks

on:
  pull_request:
    paths:
      - "arabic_span_text_encoder.py"
      - "span_alignment_loss.py"
      - "jax_span_dtw.py"
      - "jax_batch_bucketing.py"
      - "fast_hard_alignment.py"
      - "runtime_device_setup.py"
      - "ddp_runtime_policy.py"
      - "training_optimizations.py"
      - "zero_shot_preprocessing.py"
      - "zero_shot_geometry.py"
      - "zero_shot_runtime/**"
      - "vit_embedding_model.py"
      - "vit_training_runtime.py"
      - "scripts/train/**"
      - "scripts/benchmark/**"
      - "Evaluation/**"
      - "tests/test_*optimization*.py"
      - "tests/test_batched_span_dtw.py"
      - "tests/test_span_surface_cache.py"
      - "tests/test_gradient_accumulation.py"
      - "tests/test_fast_hard_alignment.py"
      - "tests/test_runtime_device_setup.py"
      - "tests/test_ddp_runtime_policy.py"
      - "tests/test_needleman_wunsch_evaluation.py"
      - "tests/test_sw_real_evaluation.py"
      - "tests/test_zero_shot_transfer.py"
      - "tests/test_zero_shot_geometry.py"
      - "tests/test_vit_embedding_model.py"
      - ".github/workflows/optimization-checks.yml"
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python syntax
        run: |
          python -m py_compile \
            Parameters.py \
            DataSet.py \
            arabic_span_text_encoder.py \
            span_alignment_loss.py \
            jax_span_dtw.py \
            jax_batch_bucketing.py \
            fast_hard_alignment.py \
            runtime_device_setup.py \
            ddp_runtime_policy.py \
            training_optimizations.py \
            zero_shot_preprocessing.py \
            zero_shot_geometry.py \
            zero_shot_runtime/sitecustomize.py \
            vit_embedding_model.py \
            vit_training_runtime.py \
            scripts/train/train_optimized.py \
            scripts/benchmark/summarize_training_speed.py \
            Evaluation/__init__.py \
            Evaluation/_eval_utils.py \
            Evaluation/window_alignment.py \
            Evaluation/phrase_alignment.py \
            Evaluation/eval_needleman_wunsch_windows.py \
            Evaluation/eval_needleman_wunsch_words.py \
            Evaluation/eval_image_to_image.py \
            Evaluation/viz_window_clusters.py \
            Evaluation/sw_core.py \
            Evaluation/sw_dataset.py \
            Evaluation/sw_runner.py \
            Evaluation/zero_shot_sw.py \
            Evaluation/vit_evaluation.py \
            Evaluation/eval_img_align_sw.py \
            Evaluation/eval_retrieval.py \
            Evaluation/eval_alignment_mae.py \
            Evaluation/viz_heatmap_dtw.py
      - name: Shell syntax
        run: |
          bash -n scripts/train/run_span_d3tw_optimized.sh
          bash -n scripts/train/run_zero_shot_synthetic_to_real.sh
          bash -n scripts/train/run_zero_shot_vit.sh
          bash -n scripts/train/run_rank_isolated.sh
          bash -n scripts/benchmark/submit_training_speed_comparison.sh

  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPAN_DTW_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.0.1 torchvision==0.15.2
          python -m pip install pytest matplotlib "jax[cpu]==0.4.35"
          python -m pip install "numpy<2"
      - name: Run all focused tests and capture logs
        run: |
          mkdir -p test-logs
          failed=0
          run_suite() {
            local name="$1"
            local path="$2"
            set +e
            pytest -vv "$path" 2>&1 | tee "test-logs/${name}.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "test-logs/${name}.status"
            if [[ "$status" -ne 0 ]]; then
              failed=1
            fi
          }
          run_suite device_setup tests/test_runtime_device_setup.py
          run_suite ddp_policy tests/test_ddp_runtime_policy.py
          run_suite blank tests/test_blank_span_dtw.py
          run_suite fast_hard tests/test_fast_hard_alignment.py
          run_suite batched_dtw tests/test_batched_span_dtw.py
          run_suite surface_cache tests/test_span_surface_cache.py
          run_suite config tests/test_optimized_training_config.py
          run_suite accumulation tests/test_gradient_accumulation.py
          run_suite needleman_wunsch tests/test_needleman_wunsch_evaluation.py
          run_suite sw_real tests/test_sw_real_evaluation.py
          run_suite zero_shot tests/test_zero_shot_transfer.py
          run_suite zero_shot_geometry tests/test_zero_shot_geometry.py
          run_suite vit tests/test_vit_embedding_model.py
          echo "$failed" > test-logs/failed.status
      - name: Upload focused test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-test-logs
          path: test-logs/
      - name: Fail when a focused suite failed
        if: always()
        run: |
          if [[ ! -f test-logs/failed.status ]]; then
            echo "Focused tests did not run" >&2
            exit 1
          fi
          if [[ "$(cat test-logs/failed.status)" != "0" ]]; then
            echo "One or more focused test suites failed. See optimization-test-logs." >&2
            exit 1
          fi
