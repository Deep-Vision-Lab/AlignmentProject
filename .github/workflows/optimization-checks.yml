name: Optimization checks

on:
  pull_request:
    paths:
      - "arabic_span_text_encoder.py"
      - "span_alignment_loss.py"
      - "jax_span_dtw.py"
      - "training_optimizations.py"
      - "scripts/train/**"
      - "scripts/benchmark/**"
      - "tests/test_*optimization*.py"
      - "tests/test_batched_span_dtw.py"
      - "tests/test_span_surface_cache.py"
      - "tests/test_gradient_accumulation.py"
      - ".github/workflows/optimization-checks.yml"
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python syntax
        run: |
          python -m py_compile \
            Parameters.py \
            DataSet.py \
            arabic_span_text_encoder.py \
            span_alignment_loss.py \
            jax_span_dtw.py \
            training_optimizations.py \
            scripts/train/train_optimized.py \
            scripts/benchmark/summarize_training_speed.py
      - name: Shell syntax
        run: |
          bash -n scripts/train/run_span_d3tw_optimized.sh
          bash -n scripts/benchmark/submit_training_speed_comparison.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.0.1 torchvision==0.15.2
          python -m pip install pytest "jax[cpu]==0.4.35"
      - name: Run focused tests
        env:
          SPAN_DTW_BACKEND: torch
        run: |
          pytest -q \
            tests/test_blank_span_dtw.py \
            tests/test_batched_span_dtw.py \
            tests/test_span_surface_cache.py \
            tests/test_optimized_training_config.py \
            tests/test_gradient_accumulation.py
